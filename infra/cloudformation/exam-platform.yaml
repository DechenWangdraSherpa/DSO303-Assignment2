AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DSO303 Assignment 2 - Online exams and assignment submission platform.
  Two-AZ VPC, CloudFront + WAF + Route 53 edge, Cognito, API Gateway + Lambda,
  Aurora PostgreSQL (writer AZ-a / reader AZ-b), DynamoDB, S3 with lifecycle,
  SQS-driven marking / upload / email workers, SES, KMS, Secrets Manager,
  CloudWatch, CloudTrail and AWS Backup.

Parameters:
  Platform:
    Type: String
    AllowedValues: [aws, emulator]
    Default: aws
    Description: "emulator = Floci local AWS (adds localhost endpoints for the browser)"
  ArtifactBucket:
    Type: String
    Description: Bucket holding the Lambda bundle (created by scripts/deploy.sh)
  CodeKey:
    Type: String
    Description: S3 key of the Lambda bundle (content hash, so every code change redeploys)
  DomainName:
    Type: String
    Default: exams.example.edu
  MailFrom:
    Type: String
    Default: no-reply@exams.example.edu
  OpsEmail:
    Type: String
    Default: cloud-ops@example.edu
  ExamPeakConcurrency:
    Type: Number
    Default: 300
    Description: Provisioned concurrency for exam-api during scheduled exam windows

Conditions:
  IsEmulator: !Equals [!Ref Platform, emulator]
  IsAws: !Equals [!Ref Platform, aws]

Mappings:
  Net:
    Vpc:      {Cidr: 10.20.0.0/16}
    PublicA:  {Cidr: 10.20.0.0/24}
    PublicB:  {Cidr: 10.20.1.0/24}
    AppA:     {Cidr: 10.20.10.0/24}
    AppB:     {Cidr: 10.20.11.0/24}
    DataA:    {Cidr: 10.20.20.0/24}
    DataB:    {Cidr: 10.20.21.0/24}

Resources:
  # =====================================================================
  # NETWORK - one VPC, three subnet tiers, mirrored in two AZs
  # =====================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [Net, Vpc, Cidr]
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-vpc'}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-igw'}]
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway}

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, PublicA, Cidr]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-public-a'}, {Key: Tier, Value: public}]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, PublicB, Cidr]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-public-b'}, {Key: Tier, Value: public}]
  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, AppA, Cidr]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-app-a'}, {Key: Tier, Value: private-app}]
  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, AppB, Cidr]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-app-b'}, {Key: Tier, Value: private-app}]
  DataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, DataA, Cidr]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-data-a'}, {Key: Tier, Value: private-data}]
  DataSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Net, DataB, Cidr]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-data-b'}, {Key: Tier, Value: private-data}]

  # One NAT gateway per AZ: losing AZ-a does not cut AZ-b's outbound path.
  NatEipA:
    Type: AWS::EC2::EIP
    Properties: {Domain: vpc}
  NatEipB:
    Type: AWS::EC2::EIP
    Properties: {Domain: vpc}
  NatGatewayA:
    Type: AWS::EC2::NatGateway
    DependsOn: IgwAttach
    Properties:
      SubnetId: !Ref PublicSubnetA
      AllocationId: !GetAtt NatEipA.AllocationId
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-nat-a'}]
  NatGatewayB:
    Type: AWS::EC2::NatGateway
    DependsOn: IgwAttach
    Properties:
      SubnetId: !Ref PublicSubnetB
      AllocationId: !GetAtt NatEipB.AllocationId
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-nat-b'}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-rt-public'}]
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: {RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  PublicAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}
  PublicAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable}

  AppRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-rt-app-a'}]
  AppRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-rt-app-b'}]
  AppDefaultRouteA:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref AppRouteTableA, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatGatewayA}
  AppDefaultRouteB:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref AppRouteTableB, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatGatewayB}
  AppAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnetA, RouteTableId: !Ref AppRouteTableA}
  AppAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnetB, RouteTableId: !Ref AppRouteTableB}

  # Data tier has NO route to the internet at all.
  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-rt-data-isolated'}]
  DataAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DataSubnetA, RouteTableId: !Ref DataRouteTable}
  DataAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DataSubnetB, RouteTableId: !Ref DataRouteTable}

  # Gateway endpoints: S3 and DynamoDB traffic stays on the AWS network and skips NAT charges.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref AppRouteTableA, !Ref AppRouteTableB]
  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref AppRouteTableA, !Ref AppRouteTableB]

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda functions in the private app subnets (egress only)
      VpcId: !Ref Vpc
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0}]
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-sg-lambda'}]
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora - PostgreSQL only from the Lambda security group
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref LambdaSecurityGroup}
      Tags: [{Key: Name, Value: !Sub '${AWS::StackName}-sg-aurora'}]

  # =====================================================================
  # SECURITY - one customer managed KMS key encrypts every data store
  # =====================================================================
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts Aurora, DynamoDB, S3, SQS, Secrets Manager and backups
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: {AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'}
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowServicesToUseKey
            Effect: Allow
            Principal: {Service: [s3.amazonaws.com, sqs.amazonaws.com, logs.amazonaws.com, backup.amazonaws.com]}
            Action: ['kms:Encrypt', 'kms:Decrypt', 'kms:GenerateDataKey*', 'kms:DescribeKey']
            Resource: '*'
  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties: {AliasName: !Sub 'alias/${AWS::StackName}-data', TargetKeyId: !Ref DataKey}

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/aurora/master'
      Description: Aurora master credentials (rotated every 30 days on AWS)
      KmsKeyId: !Ref DataKey
      GenerateSecretString:
        SecretStringTemplate: '{"username":"examadmin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # =====================================================================
  # DATABASE - Aurora PostgreSQL, writer in AZ-a, reader (failover target) in AZ-b
  # =====================================================================
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Aurora in the isolated data subnets of both AZs
      SubnetIds: [!Ref DataSubnetA, !Ref DataSubnetB]
  AuroraCluster:
    Type: AWS::RDS::DBCluster
    # Explicit for Floci, which resolves {{resolve:secretsmanager}} before creating the secret
    # unless told; on AWS the Ref inside !Sub already implies it (hence the lint suppression).
    DependsOn: DbSecret
    Metadata:
      cfn-lint: {config: {ignore_checks: [W3005]}}
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub '${AWS::StackName}-aurora'
      Engine: aurora-postgresql
      EngineVersion: '16.8'
      DatabaseName: exams
      Port: 5432
      MasterUsername: examadmin
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref DatabaseSecurityGroup]
      AvailabilityZones: [!Select [0, !GetAZs ''], !Select [1, !GetAZs '']]
      StorageEncrypted: true
      KmsKeyId: !Ref DataKey
      BackupRetentionPeriod: 35
      PreferredBackupWindow: '18:00-19:00'
      CopyTagsToSnapshot: true
      DeletionProtection: !If [IsAws, true, false]
      EnableCloudwatchLogsExports: [postgresql]
  AuroraWriter:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-aurora-writer-a'
      DBClusterIdentifier: !Ref AuroraCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.r6g.large
      AvailabilityZone: !Select [0, !GetAZs '']
      PubliclyAccessible: false
      PromotionTier: 0
  AuroraReader:
    Type: AWS::RDS::DBInstance
    DependsOn: AuroraWriter
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-aurora-reader-b'
      DBClusterIdentifier: !Ref AuroraCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.r6g.large
      AvailabilityZone: !Select [1, !GetAZs '']
      PubliclyAccessible: false
      PromotionTier: 1

  # =====================================================================
  # DYNAMODB - exam papers (hot read) and autosaved attempts (hot write)
  # =====================================================================
  ExamsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-exams'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: examId, AttributeType: S}]
      KeySchema: [{AttributeName: examId, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref DataKey}
  AttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-attempts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: studentId, AttributeType: S}
        - {AttributeName: examId, AttributeType: S}
      KeySchema:
        - {AttributeName: studentId, KeyType: HASH}
        - {AttributeName: examId, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: byExam
          KeySchema:
            - {AttributeName: examId, KeyType: HASH}
            - {AttributeName: studentId, KeyType: RANGE}
          Projection: {ProjectionType: KEYS_ONLY}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref DataKey}

  # =====================================================================
  # S3 - frontend, submissions (with 5-year lifecycle), logs
  # =====================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-frontend-${AWS::AccountId}'
      PublicAccessBlockConfiguration: !If
        - IsAws
        - {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
        - !Ref AWS::NoValue
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
  SubmissionsBucket:
    Type: AWS::S3::Bucket
    DependsOn: UploadEventsQueuePolicy
    Properties:
      BucketName: !Sub '${AWS::StackName}-submissions-${AWS::AccountId}'
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: 'aws:kms', KMSMasterKeyID: !Ref DataKey}
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: keep-5-years-then-delete
            Status: Enabled
            Prefix: submissions/
            Transitions:
              - {StorageClass: STANDARD_IA, TransitionInDays: 30}
              - {StorageClass: GLACIER_IR, TransitionInDays: 180}
              - {StorageClass: DEEP_ARCHIVE, TransitionInDays: 365}
            ExpirationInDays: 1830
            NoncurrentVersionExpiration: {NoncurrentDays: 90}
          - Id: abort-stale-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST, GET]
            AllowedOrigins: [!If [IsEmulator, 'http://localhost:4566', !Sub 'https://${DomainName}']]
            AllowedHeaders: ['*']
            MaxAge: 3000
      NotificationConfiguration:
        QueueConfigurations:
          - Event: 's3:ObjectCreated:*'
            Queue: !GetAtt UploadEventsQueue.Arn
            Filter: {S3Key: {Rules: [{Name: prefix, Value: submissions/}]}}
  SubmissionsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SubmissionsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt SubmissionsBucket.Arn, !Sub '${SubmissionsBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  LogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-logs-${AWS::AccountId}'
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      LifecycleConfiguration:
        Rules: [{Id: audit-5-years, Status: Enabled, ExpirationInDays: 1830, Transitions: [{StorageClass: GLACIER, TransitionInDays: 90}]}]
  LogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudTrailAclCheck
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:GetBucketAcl
            Resource: !GetAtt LogsBucket.Arn
          - Sid: CloudTrailWrite
            Effect: Allow
            Principal: {Service: cloudtrail.amazonaws.com}
            Action: s3:PutObject
            Resource: !Sub '${LogsBucket.Arn}/cloudtrail/AWSLogs/${AWS::AccountId}/*'
            Condition: {StringEquals: {'s3:x-amz-acl': bucket-owner-full-control}}

  # =====================================================================
  # MESSAGING - three work queues, each with a dead-letter queue
  # =====================================================================
  MarkingDlq:
    Type: AWS::SQS::Queue
    Properties: {QueueName: !Sub '${AWS::StackName}-marking-dlq', MessageRetentionPeriod: 1209600, KmsMasterKeyId: !Ref DataKey}
  MarkingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-marking'
      VisibilityTimeout: 180
      KmsMasterKeyId: !Ref DataKey
      RedrivePolicy: {deadLetterTargetArn: !GetAtt MarkingDlq.Arn, maxReceiveCount: 5}
  UploadEventsDlq:
    Type: AWS::SQS::Queue
    Properties: {QueueName: !Sub '${AWS::StackName}-upload-events-dlq', MessageRetentionPeriod: 1209600}
  UploadEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-upload-events'
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy: {deadLetterTargetArn: !GetAtt UploadEventsDlq.Arn, maxReceiveCount: 5}
  UploadEventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref UploadEventsQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: s3.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt UploadEventsQueue.Arn
            Condition:
              ArnLike: {'aws:SourceArn': !Sub 'arn:aws:s3:::${AWS::StackName}-submissions-${AWS::AccountId}'}
  NotifyDlq:
    Type: AWS::SQS::Queue
    Properties: {QueueName: !Sub '${AWS::StackName}-notify-dlq', MessageRetentionPeriod: 1209600, KmsMasterKeyId: !Ref DataKey}
  NotifyQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-notify'
      VisibilityTimeout: 120
      KmsMasterKeyId: !Ref DataKey
      RedrivePolicy: {deadLetterTargetArn: !GetAtt NotifyDlq.Arn, maxReceiveCount: 5}

  OpsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-ops-alerts'
      Subscription: [{Protocol: email, Endpoint: !Ref OpsEmail}]

  MailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties: {EmailIdentity: !Ref MailFrom}

  # =====================================================================
  # AUTHENTICATION - Cognito user pool with one group per role
  # =====================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes: []
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      Policies:
        PasswordPolicy: {MinimumLength: 12, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: false}
      Schema: [{Name: email, AttributeDataType: String, Required: true, Mutable: true}]
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 4
      IdTokenValidity: 4
      TokenValidityUnits: {AccessToken: hours, IdToken: hours}
      PreventUserExistenceErrors: ENABLED
  StudentsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {GroupName: Students, UserPoolId: !Ref UserPool, Precedence: 30}
  TutorsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {GroupName: Tutors, UserPoolId: !Ref UserPool, Precedence: 20}
  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {GroupName: Admins, UserPoolId: !Ref UserPool, Precedence: 10}

  # =====================================================================
  # COMPUTE - Lambda in the private app subnets of both AZs
  # =====================================================================
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
                Resource: [!GetAtt ExamsTable.Arn, !GetAtt AttemptsTable.Arn, !Sub '${AttemptsTable.Arn}/index/*']
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${SubmissionsBucket.Arn}/submissions/*'
              - Effect: Allow
                Action: [sqs:SendMessage, sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: [!GetAtt MarkingQueue.Arn, !GetAtt UploadEventsQueue.Arn, !GetAtt NotifyQueue.Arn]
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbSecret
              - Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !GetAtt DataKey.Arn
              - Effect: Allow
                Action: [ses:SendEmail]
                Resource: '*'
                Condition: {StringEquals: {'ses:FromAddress': !Ref MailFrom}}

  ExamApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-exam-api'
      Description: !Sub 'HTTP API router (bundle ${CodeKey})'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/api.handler
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref CodeKey}
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 512
      Timeout: 29
      TracingConfig: {Mode: Active}
      VpcConfig:
        SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          EXAMS_TABLE: !Ref ExamsTable
          ATTEMPTS_TABLE: !Ref AttemptsTable
          SUBMISSIONS_BUCKET: !Ref SubmissionsBucket
          MARKING_QUEUE_URL: !Ref MarkingQueue
          NOTIFY_QUEUE_URL: !Ref NotifyQueue
          DB_SECRET_ARN: !Ref DbSecret
          DB_HOST: !GetAtt AuroraCluster.Endpoint.Address
          DB_PORT: !GetAtt AuroraCluster.Endpoint.Port
          DB_NAME: exams
          DB_SSL: !If [IsAws, 'true', 'false']
          COGNITO_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_ISSUER: !If [IsEmulator, !Sub 'http://floci:4566/${UserPool}', !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}']
          MAIL_FROM: !Ref MailFrom
          AUTH_MODE: !If [IsEmulator, emulator, cognito-authorizer]
          PUBLIC_S3_ENDPOINT: !If [IsEmulator, 'http://localhost:4566', !Ref AWS::NoValue]
          S3_PATH_STYLE: !If [IsEmulator, 'true', 'false']
  ExamApiVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref ExamApiFunction
      Description: !Ref CodeKey
  ExamApiLiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref ExamApiFunction
      FunctionVersion: !GetAtt ExamApiVersion.Version
      Name: live

  MarkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-marker'
      Description: !Sub 'Auto-marks MCQ attempts from the marking queue (bundle ${CodeKey})'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/workers.marker
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref CodeKey}
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 256
      Timeout: 30
      ReservedConcurrentExecutions: 20   # protects Aurora during the submit burst
      TracingConfig: {Mode: Active}
      VpcConfig:
        SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          EXAMS_TABLE: !Ref ExamsTable
          ATTEMPTS_TABLE: !Ref AttemptsTable
          SUBMISSIONS_BUCKET: !Ref SubmissionsBucket
          MARKING_QUEUE_URL: !Ref MarkingQueue
          NOTIFY_QUEUE_URL: !Ref NotifyQueue
          DB_SECRET_ARN: !Ref DbSecret
          DB_HOST: !GetAtt AuroraCluster.Endpoint.Address
          DB_PORT: !GetAtt AuroraCluster.Endpoint.Port
          DB_NAME: exams
          DB_SSL: !If [IsAws, 'true', 'false']
          COGNITO_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_ISSUER: !If [IsEmulator, !Sub 'http://floci:4566/${UserPool}', !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}']
          MAIL_FROM: !Ref MailFrom
          AUTH_MODE: !If [IsEmulator, emulator, cognito-authorizer]
          PUBLIC_S3_ENDPOINT: !If [IsEmulator, 'http://localhost:4566', !Ref AWS::NoValue]
          S3_PATH_STYLE: !If [IsEmulator, 'true', 'false']
  UploadProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-upload-processor'
      Description: !Sub 'Records S3 uploads and queues tutor email (bundle ${CodeKey})'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/workers.uploadProcessor
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref CodeKey}
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 256
      Timeout: 30
      TracingConfig: {Mode: Active}
      VpcConfig:
        SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          EXAMS_TABLE: !Ref ExamsTable
          ATTEMPTS_TABLE: !Ref AttemptsTable
          SUBMISSIONS_BUCKET: !Ref SubmissionsBucket
          MARKING_QUEUE_URL: !Ref MarkingQueue
          NOTIFY_QUEUE_URL: !Ref NotifyQueue
          DB_SECRET_ARN: !Ref DbSecret
          DB_HOST: !GetAtt AuroraCluster.Endpoint.Address
          DB_PORT: !GetAtt AuroraCluster.Endpoint.Port
          DB_NAME: exams
          DB_SSL: !If [IsAws, 'true', 'false']
          COGNITO_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_ISSUER: !If [IsEmulator, !Sub 'http://floci:4566/${UserPool}', !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}']
          MAIL_FROM: !Ref MailFrom
          AUTH_MODE: !If [IsEmulator, emulator, cognito-authorizer]
          PUBLIC_S3_ENDPOINT: !If [IsEmulator, 'http://localhost:4566', !Ref AWS::NoValue]
          S3_PATH_STYLE: !If [IsEmulator, 'true', 'false']
  NotifierFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-notifier'
      Description: !Sub 'Sends tutor and result emails through SES (bundle ${CodeKey})'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/workers.notifier
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref CodeKey}
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 256
      Timeout: 30
      TracingConfig: {Mode: Active}
      VpcConfig:
        SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          EXAMS_TABLE: !Ref ExamsTable
          ATTEMPTS_TABLE: !Ref AttemptsTable
          SUBMISSIONS_BUCKET: !Ref SubmissionsBucket
          MARKING_QUEUE_URL: !Ref MarkingQueue
          NOTIFY_QUEUE_URL: !Ref NotifyQueue
          DB_SECRET_ARN: !Ref DbSecret
          DB_HOST: !GetAtt AuroraCluster.Endpoint.Address
          DB_PORT: !GetAtt AuroraCluster.Endpoint.Port
          DB_NAME: exams
          DB_SSL: !If [IsAws, 'true', 'false']
          COGNITO_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_ISSUER: !If [IsEmulator, !Sub 'http://floci:4566/${UserPool}', !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}']
          MAIL_FROM: !Ref MailFrom
          AUTH_MODE: !If [IsEmulator, emulator, cognito-authorizer]
          PUBLIC_S3_ENDPOINT: !If [IsEmulator, 'http://localhost:4566', !Ref AWS::NoValue]
          S3_PATH_STYLE: !If [IsEmulator, 'true', 'false']
  MigrateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-db-migrate'
      Description: !Sub 'Idempotent Aurora schema migration (bundle ${CodeKey})'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: src/migrate.handler
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Ref CodeKey}
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 256
      Timeout: 60
      VpcConfig:
        SubnetIds: [!Ref AppSubnetA, !Ref AppSubnetB]
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
      Environment:
        Variables:
          EXAMS_TABLE: !Ref ExamsTable
          ATTEMPTS_TABLE: !Ref AttemptsTable
          SUBMISSIONS_BUCKET: !Ref SubmissionsBucket
          MARKING_QUEUE_URL: !Ref MarkingQueue
          NOTIFY_QUEUE_URL: !Ref NotifyQueue
          DB_SECRET_ARN: !Ref DbSecret
          DB_HOST: !GetAtt AuroraCluster.Endpoint.Address
          DB_PORT: !GetAtt AuroraCluster.Endpoint.Port
          DB_NAME: exams
          DB_SSL: !If [IsAws, 'true', 'false']
          COGNITO_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          COGNITO_ISSUER: !If [IsEmulator, !Sub 'http://floci:4566/${UserPool}', !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}']
          MAIL_FROM: !Ref MailFrom
          AUTH_MODE: !If [IsEmulator, emulator, cognito-authorizer]
          PUBLIC_S3_ENDPOINT: !If [IsEmulator, 'http://localhost:4566', !Ref AWS::NoValue]
          S3_PATH_STYLE: !If [IsEmulator, 'true', 'false']

  MarkingMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties: {EventSourceArn: !GetAtt MarkingQueue.Arn, FunctionName: !Ref MarkerFunction, BatchSize: 10, FunctionResponseTypes: [ReportBatchItemFailures]}
  UploadEventsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties: {EventSourceArn: !GetAtt UploadEventsQueue.Arn, FunctionName: !Ref UploadProcessorFunction, BatchSize: 5, FunctionResponseTypes: [ReportBatchItemFailures]}
  NotifyMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties: {EventSourceArn: !GetAtt NotifyQueue.Arn, FunctionName: !Ref NotifierFunction, BatchSize: 10, FunctionResponseTypes: [ReportBatchItemFailures]}

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}-http', RetentionInDays: 90}
  ExamApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-exam-api', RetentionInDays: 90}

  # Scheduled provisioned concurrency: warm capacity is in place before an exam starts.
  ExamApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: lambda
      ScalableDimension: lambda:function:ProvisionedConcurrency
      ResourceId: !Sub 'function:${ExamApiFunction}:live'
      MinCapacity: 0
      MaxCapacity: 1000
      ScheduledActions:
        - ScheduledActionName: exam-window-warm
          Schedule: 'cron(45 2 ? * MON-FRI *)'      # 08:45 Bhutan time, 15 min before 09:00 exams
          ScalableTargetAction: {MinCapacity: !Ref ExamPeakConcurrency, MaxCapacity: 1000}
        - ScheduledActionName: exam-window-cool
          Schedule: 'cron(0 12 ? * MON-FRI *)'
          ScalableTargetAction: {MinCapacity: 0, MaxCapacity: 1000}
    DependsOn: ExamApiLiveAlias

  # =====================================================================
  # API - API Gateway HTTP API with a Cognito JWT authorizer
  # =====================================================================
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-http'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [!If [IsEmulator, 'http://localhost:4566', !Sub 'https://${DomainName}']]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 600
  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Issuer: !If
          - IsEmulator
          - !Sub 'http://floci:4566/${UserPool}'          # Floci's Cognito issuer
          - !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
        Audience: [!Ref UserPoolClient]
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !If [IsAws, !Ref ExamApiLiveAlias, !GetAtt ExamApiFunction.Arn]
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000
  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /api/health'
      Target: !Sub 'integrations/${ApiIntegration}'
  ProtectedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /api/{proxy+}'
      # AWS: API Gateway verifies the Cognito JWT. Floci's JWT authorizer rejects valid
      # tokens, so on the emulator the Lambda performs the same verification (lib.mjs).
      AuthorizationType: !If [IsEmulator, NONE, JWT]
      AuthorizerId: !If [IsEmulator, !Ref AWS::NoValue, !Ref CognitoAuthorizer]
      Target: !Sub 'integrations/${ApiIntegration}'
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings: {ThrottlingBurstLimit: 5000, ThrottlingRateLimit: 2000, DetailedMetricsEnabled: true}
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","route":"$context.routeKey","status":"$context.status","latency":"$context.integrationLatency"}'
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExamApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'
  ApiAliasInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExamApiLiveAlias
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # =====================================================================
  # EDGE - WAF, CloudFront (one domain for the SPA and /api/*), Route 53
  # =====================================================================
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${AWS::StackName}-edge-acl'
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: edge-acl}
      Rules:
        - Name: aws-common
          Priority: 1
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: common}
        - Name: aws-known-bad-inputs
          Priority: 2
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: badinputs}
        - Name: aws-sqli
          Priority: 3
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesSQLiRuleSet}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: sqli}
        - Name: per-ip-rate-limit
          Priority: 4
          Action: {Block: {}}
          # High limit: a whole campus can sit behind one NAT IP during an exam.
          Statement: {RateBasedStatement: {Limit: 20000, AggregateKeyType: IP}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ratelimit}

  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties: {Name: !Ref DomainName}
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: [{DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZone}]
  FrontendOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig: {Name: !Sub '${AWS::StackName}-oac', OriginAccessControlOriginType: s3, SigningBehavior: always, SigningProtocol: sigv4}
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Exams platform - SPA from S3, /api/* to API Gateway
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        DefaultRootObject: index.html
        WebACLId: !GetAtt WebAcl.Arn
        ViewerCertificate: {AcmCertificateArn: !Ref Certificate, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021}
        Logging: {Bucket: !GetAtt LogsBucket.DomainName, Prefix: cloudfront/}
        Origins:
          - Id: spa
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOac.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
        DefaultCacheBehavior:
          TargetOriginId: spa
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6         # CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad       # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition: {StringEquals: {'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'}}
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: A
      AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}

  # =====================================================================
  # OBSERVABILITY - alarms to the ops topic, dashboard, audit trail
  # =====================================================================
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api-5xx'
      AlarmDescription: HTTP API 5xx errors during an exam
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{Name: ApiId, Value: !Ref HttpApi}]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]
  ExamApiThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-exam-api-throttles'
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: !Ref ExamApiFunction}]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertsTopic]
  MarkingDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-marking-dlq-not-empty'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt MarkingDlq.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref OpsAlertsTopic]
  NotifyDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-notify-dlq-not-empty'
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt NotifyDlq.QueueName}]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref OpsAlertsTopic]
  AuroraCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-aurora-cpu'
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{Name: DBClusterIdentifier, Value: !Ref AuroraCluster}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Ref OpsAlertsTopic]
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-exam-day'
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"API requests / 5xx","region":"${AWS::Region}","metrics":[["AWS/ApiGateway","Count","ApiId","${HttpApi}"],[".","5xx",".","."]]}},
          {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"exam-api concurrency / throttles","region":"${AWS::Region}","metrics":[["AWS/Lambda","ConcurrentExecutions","FunctionName","${ExamApiFunction}"],[".","Throttles",".","."]]}},
          {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Autosave writes (DynamoDB)","region":"${AWS::Region}","metrics":[["AWS/DynamoDB","ConsumedWriteCapacityUnits","TableName","${AttemptsTable}"]]}},
          {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Queue depth","region":"${AWS::Region}","metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${MarkingQueue.QueueName}"],["...","${NotifyQueue.QueueName}"],["...","${UploadEventsQueue.QueueName}"]]}}
        ]}
  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: LogsBucketPolicy
    Properties:
      TrailName: !Sub '${AWS::StackName}-audit'
      S3BucketName: !Ref LogsBucket
      S3KeyPrefix: cloudtrail
      IsLogging: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true

  # =====================================================================
  # BACKUP - 5-year retention for exam records
  # =====================================================================
  BackupVault:
    Type: AWS::Backup::BackupVault
    Properties: {BackupVaultName: !Sub '${AWS::StackName}-vault', EncryptionKeyArn: !GetAtt DataKey.Arn}
  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Sub '${AWS::StackName}-records'
        BackupPlanRule:
          - RuleName: daily-35d
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: 'cron(0 19 * * ? *)'
            Lifecycle: {DeleteAfterDays: 35}
          - RuleName: monthly-5y
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: 'cron(0 20 1 * ? *)'
            Lifecycle: {MoveToColdStorageAfterDays: 90, DeleteAfterDays: 1830}
  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: backup.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup]
  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: exam-records
        IamRoleArn: !GetAtt BackupRole.Arn
        Resources:
          - !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}'
          - !GetAtt AttemptsTable.Arn
          - !GetAtt ExamsTable.Arn

Outputs:
  VpcId: {Value: !Ref Vpc}
  HttpApiId: {Value: !Ref HttpApi}
  ApiEndpoint: {Value: !GetAtt HttpApi.ApiEndpoint}
  UserPoolId: {Value: !Ref UserPool}
  UserPoolClientId: {Value: !Ref UserPoolClient}
  FrontendBucket: {Value: !Ref FrontendBucket}
  SubmissionsBucket: {Value: !Ref SubmissionsBucket}
  ExamsTable: {Value: !Ref ExamsTable}
  AttemptsTable: {Value: !Ref AttemptsTable}
  AuroraClusterId: {Value: !Ref AuroraCluster}
  AuroraWriterEndpoint: {Value: !GetAtt AuroraCluster.Endpoint.Address}
  AuroraReaderEndpoint: {Value: !GetAtt AuroraCluster.ReadEndpoint.Address}
  MarkingQueueUrl: {Value: !Ref MarkingQueue}
  NotifyQueueUrl: {Value: !Ref NotifyQueue}
  UploadEventsQueueUrl: {Value: !Ref UploadEventsQueue}
  DistributionDomain: {Value: !GetAtt Distribution.DomainName}
  WebAclArn: {Value: !GetAtt WebAcl.Arn}
  ExamApiFunction: {Value: !Ref ExamApiFunction}
  MigrateFunction: {Value: !Ref MigrateFunction}
