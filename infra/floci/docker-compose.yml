# Local AWS (Floci) for DSO303 Assignment 2 — Online Exams Platform
# Start:  ./scripts/floci-up.sh      Stop: ./scripts/floci-down.sh
name: a2-floci

services:
  floci:
    image: floci/floci:2.5.0
    container_name: a2-floci
    restart: unless-stopped
    ports:
      - "4566:4566"            # AWS API endpoint (all services)
      - "7001-7010:7001-7010"  # RDS / Aurora proxies
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # lets Floci start Lambda + Aurora containers
      - ${A2_FLOCI_DATA:?run ./scripts/floci-up.sh}:/app/data
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_STORAGE_HOST_PERSISTENT_PATH: ${A2_FLOCI_DATA}
      FLOCI_DOCKER_RESOURCE_NAMESPACE: a2
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_DOCKER_NETWORK: a2-floci_default
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: "7010"
      FLOCI_SERVICES_LAMBDA_RUNTIME_API_BASE_PORT: "9200"
      FLOCI_SERVICES_LAMBDA_RUNTIME_API_MAX_PORT: "9209"
    healthcheck:
      # the image has no curl/wget; bash's /dev/tcp is enough to probe the port
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4566"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
